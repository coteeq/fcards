<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fcard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fcard.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
<div class="page">
  <header>
    <nav class="tabs" aria-label="Main">
      <a class="tab {{ 'active' if request.endpoint == 'web.index' }}" href="{{ url_for('web.index') }}">Decks</a>
    </nav>
    <details class="user-menu">
      <summary>{{ g.user.username if g.user else 'Theme' }}</summary>
      <div class="user-menu-panel">
        <form method="post" action="{{ url_for('web.theme') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <input type="hidden" name="return_to" value="{{ request.full_path }}">
          {% for choice in ('light', 'dark', 'system') %}
          <button name="theme" value="{{ choice }}" aria-pressed="{{ 'true' if theme == choice else 'false' }}">{{ choice | title }}</button>
          {% endfor %}
        </form>
        {% if g.user %}
        <form method="post" action="{{ url_for('web.logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button>Logout</button>
        </form>
        {% endif %}
      </div>
    </details>
  </header>
  <main id="main">
    {% for message in get_flashed_messages() %}
      <p class="notice" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
